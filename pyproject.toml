[project]
name = "emind"
version = "2.0.0"
description = "Emind AI — 亦梓·智脑 大语言模型训练推理框架"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "sentencepiece>=0.1.99",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "jinja2>=3.1.0",
    "sse-starlette>=1.8.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "requests>=2.31.0",
    "pydantic>=2.10.0",
]

[project.scripts]
emind = "cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["Emind*", "training*", "data_pipeline*", "eval*"]
